<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tracelayer — coming soon</title>
    <meta name="description" content="tracelayer — coming soon." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g' cx='38%25' cy='32%25' r='75%25'%3E%3Cstop offset='0%25' stop-color='%237ff6da'/%3E%3Cstop offset='45%25' stop-color='%232fd3b3'/%3E%3Cstop offset='100%25' stop-color='%230b7d70'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='46' fill='url(%23g)'/%3E%3Cpath d='M20 50 H34 L40 34 L48 66 L56 42 L62 54 L68 50 H80' stroke='white' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <!-- three.js is vendored locally in ./vendor so the site has no runtime
         CDN dependency (works offline / version-pinned to r160). -->
    <script type="importmap">
        {
            "imports": {
                "three": "./vendor/three/three.module.js",
                "three/addons/": "./vendor/three/addons/"
            }
        }
    </script>

    <style>
        /* Self-hosted Quicksand — rounded geometric wordmark matching the logo */
        @font-face {
            font-family: 'Quicksand';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url('./vendor/fonts/quicksand-latin-400-normal.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Quicksand';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: url('./vendor/fonts/quicksand-latin-500-normal.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Quicksand';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: url('./vendor/fonts/quicksand-latin-600-normal.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Quicksand';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: url('./vendor/fonts/quicksand-latin-700-normal.woff2') format('woff2');
        }

        :root {
            --bg: #04070a;
            --teal: #2ff0c8;
            --teal-deep: #0d9488;
            --indigo: #5b6cf0;
            --text: #e8f6f2;
            --muted: rgba(200, 224, 219, 0.55);
        }

        * { box-sizing: border-box; }

        html, body {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Quicksand', system-ui, -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Deep space backdrop: radial vignette + a faint horizontal light streak
           echoing the original coming-soon art. */
        #backdrop {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(130% 85% at 50% 36%, rgba(20, 70, 66, 0.35) 0%, rgba(6, 14, 18, 0.6) 45%, #020406 78%),
                radial-gradient(55% 45% at 50% 38%, rgba(47, 240, 200, 0.06) 0%, rgba(0,0,0,0) 60%);
        }

        /* Subtle starfield */
        #stars {
            position: fixed;
            inset: 0;
            z-index: 0;
            opacity: 0.7;
            pointer-events: none;
        }

        /* Horizontal energy streak behind the orb */
        #streak {
            position: fixed;
            left: 0;
            right: 0;
            top: 38%;
            height: 2px;
            transform: translateY(-50%);
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(90deg,
                rgba(47,240,200,0) 0%,
                rgba(47,240,200,0.12) 35%,
                rgba(120,200,255,0.35) 50%,
                rgba(47,240,200,0.12) 65%,
                rgba(47,240,200,0) 100%);
            filter: blur(2px);
        }

        /* The WebGL orb canvas fills the screen and is transparent so the
           backdrop and streak show through. */
        #orb-canvas {
            position: fixed;
            inset: 0;
            z-index: 2;
            display: block;
        }

        /* Static CSS orb — only revealed when WebGL can't run */
        #orb-fallback {
            position: fixed;
            top: 38%;
            left: 50%;
            width: min(70vw, 46vh);
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            z-index: 2;
            border-radius: 50%;
            display: none;
            background:
                radial-gradient(circle at 40% 34%, #7ff6da 0%, #2fd3b3 32%, #148f9a 60%, #123a6e 100%);
            box-shadow: 0 0 90px 10px rgba(47, 240, 200, 0.4), inset 0 0 60px rgba(10, 30, 60, 0.6);
            animation: floaty 6s ease-in-out infinite;
        }
        body.no-webgl #orb-fallback { display: block; }
        body.no-webgl .hint { display: none; }
        @keyframes floaty {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50%      { transform: translate(-50%, -52%) scale(1.02); }
        }

        /* --- UI overlay: logo + wordmark + coming soon --- */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            padding-bottom: clamp(48px, 12vh, 120px);
            pointer-events: none;
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 16px;
            opacity: 0;
            animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.4s forwards;
        }

        .brand-icon {
            width: clamp(38px, 5vw, 52px);
            height: clamp(38px, 5vw, 52px);
            filter: drop-shadow(0 0 14px rgba(47, 240, 200, 0.55));
        }

        .brand-name {
            font-size: clamp(30px, 5.5vw, 52px);
            font-weight: 500;
            letter-spacing: 0.5px;
            color: #f3fbf8;
            text-shadow: 0 0 24px rgba(47, 240, 200, 0.25);
        }

        .tagline {
            margin-top: 22px;
            font-size: clamp(11px, 1.6vw, 14px);
            font-weight: 600;
            letter-spacing: 0.62em;
            text-indent: 0.62em;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 14px;
            opacity: 0;
            animation: rise 1.4s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        .tagline .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--teal);
            box-shadow: 0 0 10px var(--teal);
            animation: pulse 2.4s ease-in-out infinite;
        }

        @keyframes rise {
            from { opacity: 0; transform: translateY(18px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        /* Loading state */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg);
            transition: opacity 0.8s ease;
        }
        #loader.hidden { opacity: 0; pointer-events: none; }
        #loader .ring {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(47, 240, 200, 0.15);
            border-top-color: var(--teal);
            animation: spin 0.9s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .hint {
            position: fixed;
            bottom: 18px;
            left: 0;
            right: 0;
            z-index: 3;
            text-align: center;
            font-size: 11px;
            letter-spacing: 0.18em;
            color: rgba(200, 224, 219, 0.28);
            pointer-events: none;
            text-transform: uppercase;
        }

        @media (max-width: 600px) {
            .brand { gap: 12px; }
        }
    </style>
</head>
<body>
    <div id="backdrop"></div>
    <canvas id="stars"></canvas>
    <div id="streak"></div>
    <canvas id="orb-canvas"></canvas>
    <!-- Static fallback shown only if WebGL is unavailable -->
    <div id="orb-fallback" aria-hidden="true"></div>

    <div class="overlay">
        <div class="brand">
            <svg class="brand-icon" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <defs>
                    <radialGradient id="orbGrad" cx="38%" cy="32%" r="75%">
                        <stop offset="0%" stop-color="#7ff6da" />
                        <stop offset="45%" stop-color="#2fd3b3" />
                        <stop offset="100%" stop-color="#0b7d70" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="46" fill="url(#orbGrad)" />
                <path d="M20 50 H34 L40 34 L48 66 L56 42 L62 54 L68 50 H80"
                      stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"
                      stroke-linejoin="round" fill="none" />
            </svg>
            <span class="brand-name">tracelayer</span>
        </div>

        <div class="tagline">
            <span class="dot"></span>
            <span>COMING SOON</span>
        </div>
    </div>

    <div class="hint">drag to explore</div>

    <div id="loader"><div class="ring"></div></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';

        // ---------------------------------------------------------------------
        // Tracelayer orb — teal → indigo volumetric fractal.
        // Tuned from the "Magical AI Orb" preset system to match the brand.
        // ---------------------------------------------------------------------
        const params = {
            primaryEnergy: '#2ff0c8',   // bright teal core (brand color)
            secondaryEnergy: '#4f46e5', // indigo wisps at the edges
            speed: 0.5,
            density: 2.3,
            atmosphereGlow: 0.42,
            atmosphereLevel: 1.0,
            atmosphereScale: 1.045,
            orbRotation: 0.32,
            internalAnim: 0.4,
            fractalIters: 4,
            fractalScale: 0.97,
            fractalDecay: -16.7,
            smoothness: 0.031,
            asymmetry: 0.55,
            chromaticAberration: 0.02
        };

        // Graceful degradation: if the browser can't give us a WebGL context,
        // reveal the static CSS orb and stop before touching three.js.
        function webglSupported() {
            try {
                const c = document.createElement('canvas');
                return !!(window.WebGLRenderingContext &&
                    (c.getContext('webgl') || c.getContext('experimental-webgl')));
            } catch (e) { return false; }
        }
        if (!webglSupported()) {
            document.body.classList.add('no-webgl');
            document.getElementById('loader').classList.add('hidden');
            throw new Error('WebGL unavailable — showing static fallback orb.');
        }

        // Respect users who prefer reduced motion: keep the orb alive but calm.
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
            params.speed *= 0.25;
            params.orbRotation *= 0.25;
            params.internalAnim *= 0.25;
        }

        // Cap resolution for the expensive raymarch; keep it crisp on retina.
        const dpr = Math.min(window.devicePixelRatio || 1, 1.5) * 0.85;

        const canvas = document.getElementById('orb-canvas');
        const scene = new THREE.Scene(); // transparent — CSS backdrop shows through

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        // Pulled back so the orb reads as a contained sphere with clear dark
        // space below it for the wordmark (matching the coming-soon layout).
        camera.position.set(0, 0, 8.4);

        // Vertical framing offset: lift the orb above centre. Applied to both the
        // mesh and the orbit target so drag-to-rotate stays centred on the orb.
        const ORB_LIFT = 0.95;

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(dpr);
        renderer.setClearColor(0x000000, 0);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;
        controls.enableZoom = false;
        controls.minDistance = 4;
        controls.maxDistance = 10;
        controls.target.set(0, ORB_LIFT, 0);
        controls.update();

        const vertexShader = `
            varying vec3 vLocalPosition;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vLocalPosition = position;
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform vec3 uLocalCamPos;
            uniform vec3 uPrimaryColor;
            uniform vec3 uSecondaryColor;
            uniform float uDensity;
            uniform float uFractalIters;
            uniform float uFractalScale;
            uniform float uFractalDecay;
            uniform float uInternalAnim;
            uniform float uSmoothness;
            uniform float uAsymmetry;

            varying vec3 vLocalPosition;
            varying vec3 vNormal;
            varying vec3 vViewPosition;

            float evaluateStructure(vec3 pos) {
                float densityAcc = 0.0;
                vec3 anchor = pos;

                float animTime = uTime * uInternalAnim;
                float s = sin(animTime);
                float c = cos(animTime);
                mat2 rotAnim = mat2(c, s, -s, c);

                float a = 0.5 * uAsymmetry;
                mat2 rotAsym1 = mat2(cos(a), sin(a), -sin(a), cos(a));
                float b = 0.3 * uAsymmetry;
                mat2 rotAsym2 = mat2(cos(b), sin(b), -sin(b), cos(b));

                for (int step = 0; step < 12; ++step) {
                    if (float(step) >= uFractalIters) break;

                    pos.xy *= rotAnim;
                    pos.yz *= rotAnim;
                    pos.xz *= rotAsym1;
                    pos.yz *= rotAsym2;
                    pos += vec3(0.05, -0.02, 0.03) * uAsymmetry;

                    vec3 foldedPos = sqrt(pos * pos + uSmoothness);
                    float magnitudeSq = dot(foldedPos, foldedPos);
                    magnitudeSq = max(magnitudeSq, 0.00001);

                    pos = (uFractalScale * foldedPos / magnitudeSq) - uFractalScale;

                    float ySq = pos.y * pos.y;
                    float zSq = pos.z * pos.z;
                    float yz2 = 2.0 * pos.y * pos.z;
                    pos.yz = vec2(ySq - zSq, yz2);

                    pos = vec3(pos.z, pos.x, pos.y);

                    densityAcc += exp(uFractalDecay * abs(dot(pos, anchor)));
                }
                return densityAcc * 0.5;
            }

            vec2 getVolumeBounds(vec3 origin, vec3 dir, float radius) {
                float b = dot(origin, dir);
                float c = dot(origin, origin) - radius * radius;
                float discriminant = b * b - c;
                if (discriminant < 0.0) return vec2(-1.0);
                float root = sqrt(discriminant);
                return vec2(-b - root, -b + root);
            }

            vec3 traceEnergy(vec3 origin, vec3 dir, vec2 limits) {
                float currentDepth = limits.x;
                float marchStep = 0.02;
                vec3 finalEnergy = vec3(0.0);
                float fieldVal = 0.0;

                for (int i = 0; i < 64; i++) {
                    currentDepth += marchStep * exp(-2.0 * fieldVal);
                    if (currentDepth > limits.y) break;

                    vec3 samplePoint = origin + currentDepth * dir;
                    fieldVal = evaluateStructure(samplePoint);

                    float vSq = fieldVal * fieldVal;
                    float gradientBlend = smoothstep(0.0, 0.4, fieldVal);
                    vec3 currentGradient = mix(uSecondaryColor, uPrimaryColor, gradientBlend);
                    vec3 emission = currentGradient * (fieldVal * 1.8 + vSq * 1.0);
                    finalEnergy = 0.99 * finalEnergy + (0.08 * uDensity) * emission;
                }
                return finalEnergy;
            }

            void main() {
                vec3 rayOrig = uLocalCamPos;
                vec3 rayDir = normalize(vLocalPosition - uLocalCamPos);

                float t = uTime * 0.1;
                float s = sin(t);
                float c = cos(t);
                mat2 rotXZ = mat2(c, s, -s, c);
                rayOrig.xz *= rotXZ;
                rayDir.xz *= rotXZ;

                vec2 limits = getVolumeBounds(rayOrig, rayDir, 2.0);
                if (limits.x < 0.0) discard;

                vec3 volumeColor = traceEnergy(rayOrig, rayDir, limits);

                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                float facingRatio = max(dot(normal, viewDir), 0.0);
                float edgeAA = smoothstep(0.0, 0.05, facingRatio);

                vec3 finalColor = 0.5 * log(1.0 + volumeColor);
                finalColor = clamp(finalColor, 0.0, 1.0);
                finalColor *= edgeAA;

                float maxLuma = max(finalColor.r, max(finalColor.g, finalColor.b));
                float alpha = clamp(maxLuma * 1.5, 0.0, 1.0) * edgeAA;

                gl_FragColor = vec4(finalColor, alpha);
            }
        `;

        const uniforms = {
            uTime: { value: 0 },
            uLocalCamPos: { value: new THREE.Vector3() },
            uPrimaryColor: { value: new THREE.Color(params.primaryEnergy) },
            uSecondaryColor: { value: new THREE.Color(params.secondaryEnergy) },
            uDensity: { value: params.density },
            uFractalIters: { value: params.fractalIters },
            uFractalScale: { value: params.fractalScale },
            uFractalDecay: { value: params.fractalDecay },
            uInternalAnim: { value: params.internalAnim },
            uSmoothness: { value: params.smoothness },
            uAsymmetry: { value: params.asymmetry }
        };

        const material = new THREE.ShaderMaterial({
            vertexShader, fragmentShader, uniforms,
            transparent: true,
            side: THREE.DoubleSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        // Atmosphere halo — the soft teal ring around the silhouette.
        const atmosphereFragmentShader = `
            uniform vec3 uColor;
            uniform float uGlow;
            uniform float uLevel;
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vec3 normal = normalize(vNormal);
                vec3 viewDir = normalize(vViewPosition);
                float vdn = max(dot(normal, viewDir), 0.0);
                float edgeFade = smoothstep(0.0, 0.15, vdn);
                float innerFadePoint = clamp(1.0 - uLevel, 0.0, 0.99);
                float centerFade = smoothstep(1.0, innerFadePoint, vdn);
                float alpha = edgeFade * centerFade * uGlow;
                gl_FragColor = vec4(uColor, alpha);
            }
        `;
        const atmosphereVertexShader = `
            varying vec3 vNormal;
            varying vec3 vViewPosition;
            void main() {
                vNormal = normalize(normalMatrix * normal);
                vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                vViewPosition = -mvPosition.xyz;
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const atmosphereUniforms = {
            uColor: { value: new THREE.Color(params.primaryEnergy) },
            uGlow: { value: params.atmosphereGlow },
            uLevel: { value: params.atmosphereLevel }
        };

        const atmosphereMaterial = new THREE.ShaderMaterial({
            vertexShader: atmosphereVertexShader,
            fragmentShader: atmosphereFragmentShader,
            uniforms: atmosphereUniforms,
            transparent: true,
            side: THREE.FrontSide,
            depthWrite: false,
            blending: THREE.AdditiveBlending
        });

        const geometry = new THREE.SphereGeometry(2.0, 128, 128);
        const orb = new THREE.Mesh(geometry, material);
        orb.position.y = ORB_LIFT;
        scene.add(orb);

        const atmosphereMesh = new THREE.Mesh(geometry, atmosphereMaterial);
        atmosphereMesh.scale.setScalar(params.atmosphereScale);
        orb.add(atmosphereMesh);

        // --- Post-processing: chromatic aberration for a lens-glow finish ---
        const composer = new EffectComposer(renderer);
        composer.setPixelRatio(dpr);
        composer.addPass(new RenderPass(scene, camera));

        const ChromaticAberrationShader = {
            uniforms: {
                tDiffuse: { value: null },
                uAmount: { value: params.chromaticAberration }
            },
            vertexShader: `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `,
            fragmentShader: `
                uniform sampler2D tDiffuse;
                uniform float uAmount;
                varying vec2 vUv;
                void main() {
                    vec4 baseColor = texture2D(tDiffuse, vUv);
                    float luma = max(baseColor.r, max(baseColor.g, baseColor.b));
                    float mask = smoothstep(0.01, 0.1, luma);
                    vec2 offset = (vUv - 0.5) * uAmount;
                    float r = texture2D(tDiffuse, vUv + offset).r;
                    float g = texture2D(tDiffuse, vUv).g;
                    float b = texture2D(tDiffuse, vUv - offset).b;
                    vec3 aberratedColor = vec3(r, g, b);
                    vec3 rgb = mix(baseColor.rgb, aberratedColor, mask);
                    // Preserve alpha so the page background shows through.
                    gl_FragColor = vec4(rgb, baseColor.a);
                }
            `
        };
        const caPass = new ShaderPass(ChromaticAberrationShader);
        composer.addPass(caPass);

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Starfield (lightweight 2D canvas) ---
        const starCanvas = document.getElementById('stars');
        const sctx = starCanvas.getContext('2d');
        let starList = [];
        function buildStars() {
            starCanvas.width = window.innerWidth;
            starCanvas.height = window.innerHeight;
            const count = Math.floor((window.innerWidth * window.innerHeight) / 5200);
            starList = Array.from({ length: count }, () => ({
                x: Math.random() * starCanvas.width,
                y: Math.random() * starCanvas.height,
                r: Math.random() * 1.1 + 0.2,
                a: Math.random() * 0.5 + 0.15,
                tw: Math.random() * 0.02 + 0.004
            }));
        }
        function drawStars(time) {
            sctx.clearRect(0, 0, starCanvas.width, starCanvas.height);
            for (const st of starList) {
                const flicker = st.a + Math.sin(time * st.tw + st.x) * 0.15;
                sctx.beginPath();
                sctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
                sctx.fillStyle = `rgba(200, 240, 235, ${Math.max(0, flicker)})`;
                sctx.fill();
            }
        }
        buildStars();
        window.addEventListener('resize', buildStars);

        // --- Animation loop ---
        const clock = new THREE.Clock();
        const localCam = new THREE.Vector3();
        let started = false;

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsed = clock.elapsedTime;

            uniforms.uTime.value += delta * params.speed;

            orb.rotation.y += delta * params.orbRotation;
            orb.rotation.x += delta * (params.orbRotation * 0.5);
            orb.updateMatrixWorld();

            localCam.copy(camera.position);
            orb.worldToLocal(localCam);
            uniforms.uLocalCamPos.value.copy(localCam);

            controls.update();
            drawStars(elapsed * 1000);
            composer.render();

            if (!started) {
                started = true;
                document.getElementById('loader').classList.add('hidden');
            }
        }
        animate();
    </script>
</body>
</html>
