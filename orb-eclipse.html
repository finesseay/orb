<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tracelayer — coming soon</title>
<style>
  /* Quicksand (self-hosted in the repo). Falls back gracefully in previews. */
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:500;
    font-display:swap;
    src:url("vendor/fonts/quicksand-latin-500-normal.woff2") format("woff2");
  }
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:600;
    font-display:swap;
    src:url("vendor/fonts/quicksand-latin-600-normal.woff2") format("woff2");
  }

  :root{
    --bg:#050507;
    --disc-1:#141519;
    --disc-2:#08080b;
    --ink:#e9eaf2;
    --muted:#aeb2c4;

    --teal:#2ff0c8;        /* brand primary */
    --indigo:#4f46e5;      /* brand secondary */

    --orb:260px;
    --spread:34px;

    /* one shared ring shape, reused by every glow layer */
    --ring:radial-gradient(circle at 50% 50%,
      transparent 41%, #000 51%, #000 55%, transparent 71%);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 40%, #0b0c11 0%, var(--bg) 62%, #000 100%);
    color:var(--ink);
    font-family:"Quicksand",ui-rounded,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; overflow:hidden;
  }

  .stage{
    display:flex; flex-direction:column; align-items:center;
    gap:52px; text-align:center; padding:24px;
  }

  /* ---- the orb ---- */
  .orb{ position:relative; width:var(--orb); height:var(--orb); isolation:isolate; }

  /* Layer 1 — the steady teal→indigo ring. Drifts slowly so the two brand
     colors trade places around the rim. Kept soft, not glary. */
  .corona{
    position:absolute; inset:calc(-1 * var(--spread)); border-radius:50%;
    background:conic-gradient(from 210deg,
      var(--teal), var(--indigo), var(--teal), var(--indigo), var(--teal));
    -webkit-mask:var(--ring); mask:var(--ring);
    filter:blur(19px); opacity:.5;
    animation:drift 22s linear infinite;
    z-index:1;
  }

  /* Layer 2 — a bright spot of light that travels around the ring. This is
     the "moving glow": a narrow, brighter arc that revolves faster than the
     base, so a highlight sweeps continuously around the orb. */
  .corona::after{
    content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg,
      transparent 0deg, var(--teal) 14deg, #d7fff4 26deg,
      var(--indigo) 40deg, transparent 82deg, transparent 360deg);
    -webkit-mask:var(--ring); mask:var(--ring);
    filter:blur(15px); opacity:.85; mix-blend-mode:screen;
    animation:travel 6.5s linear infinite;
  }

  /* the dark sphere over the corona centre */
  .disc{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 34%, var(--disc-1), var(--disc-2) 68%);
    box-shadow:
      inset 0 -10px 30px rgba(0,0,0,.85),
      inset 0 4px 14px rgba(255,255,255,.03);
    display:grid; place-items:center; z-index:2;
  }

  /* the tracelayer pulse mark, white on the dark disc */
  .mark{
    width:44%; color:var(--ink);
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
  }

  /* ---- copy ---- */
  .wordmark{
    margin:0; font-size:clamp(30px,7vw,52px); font-weight:600;
    letter-spacing:.005em; color:#c7cbe6;
  }

  /* Coming-soon pill with a glowing dot */
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    margin-top:20px; padding:8px 16px 8px 14px;
    border-radius:999px;
    background:rgba(255,255,255,.035);
    border:1px solid rgba(255,255,255,.08);
    font-size:11px; font-weight:600; letter-spacing:.28em;
    text-transform:uppercase; color:var(--muted);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--teal); box-shadow:0 0 10px var(--teal);
    animation:blink 2.6s ease-in-out infinite;
  }

  @keyframes drift  { to { transform:rotate(-360deg); } }
  @keyframes travel { to { transform:rotate(360deg); } }
  @keyframes blink  { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }

  @media (prefers-reduced-motion:reduce){
    .corona, .corona::after, .dot{ animation:none }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="orb" role="img" aria-label="tracelayer glowing orb">
      <div class="corona"></div>
      <div class="disc">
        <!-- pulse / trace mark from the tracelayer logo -->
        <svg class="mark" viewBox="0 0 100 40" fill="none"
             stroke="currentColor" stroke-width="7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 22 H30 L40 6 L52 34 L59 22 H95"/>
        </svg>
      </div>
    </div>

    <div>
      <h1 class="wordmark">tracelayer</h1>
      <span class="badge"><span class="dot"></span>Coming soon</span>
    </div>
  </main>
</body>
</html>
