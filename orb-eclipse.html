<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tracelayer — coming soon</title>
<style>
  /* Quicksand (self-hosted in the repo). Falls back gracefully in previews. */
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:500;
    font-display:swap;
    src:url("vendor/fonts/quicksand-latin-500-normal.woff2") format("woff2");
  }
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:600;
    font-display:swap;
    src:url("vendor/fonts/quicksand-latin-600-normal.woff2") format("woff2");
  }

  :root{
    --bg:#050507;
    --disc-1:#141519;      /* top of the sphere, catching light */
    --disc-2:#08080b;      /* shaded lower body */
    --ink:#e9eaf2;
    --muted:#7d8296;

    --teal:#2ff0c8;        /* brand primary */
    --indigo:#4f46e5;      /* brand secondary */

    --orb:260px;           /* diameter of the dark disc */
    --spread:34px;         /* how far the corona reaches past the rim */
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 40%, #0b0c11 0%, var(--bg) 62%, #000 100%);
    color:var(--ink);
    font-family:"Quicksand",ui-rounded,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid;
    place-items:center;
    overflow:hidden;
  }

  .stage{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:52px;
    text-align:center;
    padding:24px;
  }

  /* ---- the orb ---- */
  .orb{
    position:relative;
    width:var(--orb);
    height:var(--orb);
    isolation:isolate;
  }

  /* The corona ring. A teal→indigo conic gradient is masked into a thin ring
     and blurred into a soft halo. It rotates slowly, so the two brand colors
     drift around the rim — no hue-cycling, no other colors, no harsh glare. */
  .corona{
    position:absolute;
    inset:calc(-1 * var(--spread));
    border-radius:50%;
    background:conic-gradient(from 210deg,
      var(--teal), var(--indigo), var(--teal), var(--indigo), var(--teal));
    -webkit-mask:radial-gradient(circle at 50% 50%,
      transparent 41%, #000 51%, #000 55%, transparent 71%);
            mask:radial-gradient(circle at 50% 50%,
      transparent 41%, #000 51%, #000 55%, transparent 71%);
    filter:blur(19px);
    opacity:.62;                 /* keep it soft, not glary */
    animation:spin 16s linear infinite, breathe 7s ease-in-out infinite;
    z-index:1;
  }

  /* The dark sphere over the corona centre — slight off-centre radial for
     volume, inset shadow to deepen the lower edge so it reads as a ball. */
  .disc{
    position:absolute;
    inset:0;
    border-radius:50%;
    background:radial-gradient(circle at 50% 34%, var(--disc-1), var(--disc-2) 68%);
    box-shadow:
      inset 0 -10px 30px rgba(0,0,0,.85),
      inset 0 4px 14px rgba(255,255,255,.03);
    display:grid;
    place-items:center;
    z-index:2;
  }

  /* the tracelayer pulse mark, in white on the dark disc */
  .mark{
    width:42%;
    color:var(--ink);
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
  }

  /* ---- copy ---- */
  .wordmark{
    margin:0;
    font-size:clamp(30px,7vw,52px);
    font-weight:600;
    letter-spacing:.005em;
    color:#c7cbe6;              /* soft lavender, like the logo wordmark */
  }
  .tagline{
    margin:14px 0 0;
    font-size:12px;
    font-weight:500;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--muted);
  }

  @keyframes spin  { to { transform:rotate(360deg); } }
  @keyframes breathe{
    0%,100%{ opacity:.55 }
    50%    { opacity:.7 }
  }

  @media (prefers-reduced-motion:reduce){
    .corona{ animation:none }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="orb" role="img" aria-label="tracelayer glowing orb">
      <div class="corona"></div>
      <div class="disc">
        <svg class="mark" viewBox="0 0 100 44" fill="none"
             stroke="currentColor" stroke-width="7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 24 H33 L42 8 L54 38 L61 24 H94"/>
        </svg>
      </div>
    </div>

    <div>
      <h1 class="wordmark">tracelayer</h1>
      <p class="tagline">Coming soon</p>
    </div>
  </main>
</body>
</html>
