<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tracelayer — coming soon</title>
<style>
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:500; font-display:swap;
    src:url("vendor/fonts/quicksand-latin-500-normal.woff2") format("woff2");
  }
  @font-face{
    font-family:"Quicksand"; font-style:normal; font-weight:600; font-display:swap;
    src:url("vendor/fonts/quicksand-latin-600-normal.woff2") format("woff2");
  }

  :root{
    --bg:#050507;
    --disc-1:#141519;
    --disc-2:#08080b;
    --ink:#e9eaf2;
    --muted:#aeb2c4;

    --teal:#2ff0c8;
    --indigo:#4f46e5;

    --orb:260px;
    --spread:34px;

    --ring:radial-gradient(circle at 50% 50%,
      transparent 41%, #000 51%, #000 55%, transparent 71%);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(120% 90% at 50% 40%, #0b0c11 0%, var(--bg) 62%, #000 100%);
    color:var(--ink);
    font-family:"Quicksand",ui-rounded,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:grid; place-items:center; overflow:hidden;
  }

  .stage{
    display:flex; flex-direction:column; align-items:center;
    gap:56px; text-align:center; padding:24px;
  }

  /* ---- the orb ---- */
  .orb{ position:relative; width:var(--orb); height:var(--orb); isolation:isolate; }

  /* dim, steady teal→indigo base ring so there's always a full halo */
  .corona{
    position:absolute; inset:calc(-1 * var(--spread)); border-radius:50%;
    background:conic-gradient(from 210deg,
      var(--teal), var(--indigo), var(--teal), var(--indigo), var(--teal));
    -webkit-mask:var(--ring); mask:var(--ring);
    filter:blur(19px); opacity:.34;
    animation:drift 26s linear infinite;
    z-index:1;
  }

  /* THE MOVING LIGHT — two glowing blobs (teal + indigo) that orbit the rim.
     They sit on opposite sides of a wrapper that rotates, so two highlights
     chase each other around the ring. Unmistakably in motion. */
  .sweep{
    position:absolute; inset:0; border-radius:50%; z-index:1;
    animation:orbit 11s linear infinite;
  }
  .spark{
    position:absolute; left:50%; width:140px; height:140px; margin-left:-70px;
    border-radius:50%; mix-blend-mode:screen; filter:blur(17px);
    animation:glow 3.4s ease-in-out infinite;   /* breathe as it travels */
  }
  .spark--teal{
    top:0; margin-top:-64px;
    background:radial-gradient(circle,
      rgba(215,255,244,.95), rgba(47,240,200,.7) 38%, transparent 68%);
  }
  .spark--indigo{
    bottom:0; margin-bottom:-64px;
    background:radial-gradient(circle,
      rgba(150,140,255,.9), rgba(79,70,229,.6) 40%, transparent 70%);
    animation-delay:-1.7s;                       /* offset so they pulse apart */
  }

  /* the dark sphere over the corona centre */
  .disc{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle at 50% 34%, var(--disc-1), var(--disc-2) 68%);
    box-shadow:
      inset 0 -10px 30px rgba(0,0,0,.85),
      inset 0 4px 14px rgba(255,255,255,.03);
    display:grid; place-items:center; z-index:2;
  }
  .mark{
    width:42%; color:var(--ink);
    filter:drop-shadow(0 2px 10px rgba(0,0,0,.55));
  }

  /* ---- brand lockup under the orb ---- */
  .brand{ display:flex; flex-direction:column; align-items:center; gap:22px; }

  .logo{ display:inline-flex; align-items:center; gap:18px; }
  .logo-icon{
    width:64px; height:64px; border-radius:18px;
    background:linear-gradient(140deg, var(--indigo) 5%, #4b7ce8 45%, var(--teal) 100%);
    display:grid; place-items:center;
    box-shadow:0 12px 30px rgba(79,70,229,.35), inset 0 1px 1px rgba(255,255,255,.25);
  }
  .logo-icon svg{ width:54%; color:#fff; }
  .logo-word{
    font-size:clamp(34px,7vw,50px); font-weight:600;
    letter-spacing:.005em; color:#c7cbe6;
  }

  /* coming-soon — standalone text with a glowing dot */
  .badge{
    display:inline-flex; align-items:center; gap:10px;
    font-size:11px; font-weight:600; letter-spacing:.28em;
    text-transform:uppercase; color:var(--muted);
  }
  .dot{
    width:7px; height:7px; border-radius:50%;
    background:var(--teal); box-shadow:0 0 10px var(--teal);
    animation:blink 2.6s ease-in-out infinite;
  }

  @keyframes orbit { to { transform:rotate(360deg); } }
  @keyframes drift { to { transform:rotate(-360deg); } }
  @keyframes blink { 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
  /* the traveling light swells and dims slightly as it goes round */
  @keyframes glow  {
    0%,100%{ opacity:.6;  transform:scale(.86) }
    50%    { opacity:1;   transform:scale(1.08) }
  }

  @media (prefers-reduced-motion:reduce){
    .corona,.sweep,.spark,.dot{ animation:none }
  }
</style>
</head>
<body>
  <main class="stage">
    <div class="orb" role="img" aria-label="tracelayer glowing orb">
      <div class="corona"></div>
      <div class="sweep">
        <span class="spark spark--teal"></span>
        <span class="spark spark--indigo"></span>
      </div>
      <div class="disc">
        <svg class="mark" viewBox="0 0 100 40" fill="none" stroke="currentColor"
             stroke-width="7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 22 H30 L40 6 L52 34 L59 22 H95"/>
        </svg>
      </div>
    </div>

    <div class="brand">
      <div class="logo">
        <span class="logo-icon">
          <svg viewBox="0 0 100 40" fill="none" stroke="currentColor" stroke-width="8"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 22 H30 L40 6 L52 34 L59 22 H94"/>
          </svg>
        </span>
        <span class="logo-word">tracelayer</span>
      </div>
      <span class="badge"><span class="dot"></span>Coming soon</span>
    </div>
  </main>
</body>
</html>
